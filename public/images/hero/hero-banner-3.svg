      <stop offset="0%" style="stop-color:#a07d3d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9a052;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a6a2f;stop-opacity:1" />
